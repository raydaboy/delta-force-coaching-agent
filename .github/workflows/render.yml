name: render-coaching-video

on:
  workflow_dispatch:
    inputs:
      out_name:
        description: 'Artifact file name (rendered.webm or rendered.mp4)'
        required: false
        default: 'rendered.webm'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install render toolchain
        run: |
          mkdir -p /tmp/rw && cd /tmp/rw
          npm init -y >/dev/null 2>&1
          npm install @diffusionstudio/core playwright esbuild >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Render sample composition (headless Diffusion Studio / core)
        run: |
          cp "$GITHUB_WORKSPACE/scripts/render_headless.mjs" /tmp/rw/
          cp "$GITHUB_WORKSPACE/scripts/render-entry.mjs" /tmp/rw/
          cd /tmp/rw
          node render_headless.mjs --out /tmp/rw/${{ github.event.inputs.out_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: /tmp/rw/${{ github.event.inputs.out_name }}
