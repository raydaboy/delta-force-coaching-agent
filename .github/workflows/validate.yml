name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m py_compile scripts/*.py deploy/worker.py
      - run: python scripts/test_context_detector.py
      - run: python scripts/validate_player_profile.py examples/player_profile_blank.json
