name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m py_compile scripts/*.py deploy/worker.py
      - run: python scripts/test_context_detector.py
      - run: python scripts/validate_player_profile.py examples/player_profile_blank.json
      - run: python scripts/validate_teaching.py examples/delta_force_session/teaching_lessons.json
      - run: python scripts/validate_episode_script.py examples/episode_script.json
      - run: python scripts/validate_episode_handoff.py examples/scene_recipe.json
      - run: python scripts/validate_edit_map.py examples/delta_force_session/edit_map.json
      - run: python -m pytest
