[project]
name = "goal-aware-gameplay-coaching-agent"
version = "0.1.0"
description = "Evidence-first gameplay analysis and pure coaching video pipeline"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
local-tts = ["kokoro-onnx>=0.6,<1"]
llm = ["openai>=1.50,<2"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1"]

autonomous = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "soundfile>=0.12,<1",
  "kokoro-onnx>=0.6,<1",
  "openai>=1.50,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
